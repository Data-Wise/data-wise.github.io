project:
  type: website
  output-dir: _site
  pre-render:
    - python3 scripts/sync_publications.py

website:
  title: "Davood Tofighi"
  description: "Statistics, Biostatistics & Causal Mediation Analysis"
  site-url: https://data-wise.github.io
  
  navbar:
    background: dark
    logo: "assets/logo.svg"
    title: "Davood Tofighi"
    left:
      - text: Home
        href: index.qmd
      - text: Research
        href: research.qmd
      - text: Publications
        href: publications.qmd
      - text: Software
        href: software.qmd
      - text: Teaching
        href: teaching.qmd
    right:
      - icon: github
        href: https://github.com/Data-Wise
      - icon: envelope
        href: mailto:dtofighi@unm.edu

  page-footer:
    background: dark
    center: |
      © 2026 Davood Tofighi · [mediationverse](https://github.com/Data-Wise/mediationverse) · [Research workflow tools](tools.qmd)

format:
  html:
    # Active theme: slate-modern.scss (slate + teal, Inter). Light mode only:
    # the content classes are styled for a light page. Built-but-dormant
    # alternates share the same content classes — switch the `light:` line:
    #   causal-graph.scss  — previous theme (DAG node/edge motif, IBM Plex);
    #                        pair with `dark: [darkly, causal-graph.scss]`
    #   field-notes.scss   — empirical-notebook, monospace, grid paper
    #   journal-serif.scss — single serif family, stats-journal typesetting
    #     NOTE: journal-serif.scss uses a LIGHT navbar ($paper bg, dark ink
    #     text) — also change `navbar: background: dark` to `light` above.
    #   warm-academic.scss — original cream/terracotta theme (unreferenced)
    theme:
      light: [default, slate-modern.scss]
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    toc: true
    code-copy: true
